# Packaging, dependency, CLI, lint, and test configuration for Rotor.
[project]
name = "rotor"
version = "0.2.0"
description = "Small Sera Virtual Liquidity market maker"
authors = [
    { name = "Xue Yao", email = "9745649+xy-tech@users.noreply.github.com" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<4.0"
dependencies = [
    "eth-account>=0.13.0",
    "httpx>=0.27",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
rotor = "rotor.cli.main:main"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3,<10.0.0"
ruff = "^0.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741"]  # E501: line length is left to review (limit above); E741: ambiguous var name

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "testnet: opt-in tests that call the real Sera testnet API",
    "live_prices: opt-in tests that call the real public FX reference sources",
]
